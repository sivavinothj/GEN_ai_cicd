name: CI
on:
  pull_request:
  push:
    branches: ['**']               # includes main, so tests gate the CD
    tags: ['v*']

concurrency:                       # cancel superseded runs on the same ref (never a main/tag release)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read                   # least privilege

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen      # uses uv.lock → reproducible
      - run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false              # build only, don't publish
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD runs only if test AND docker-build succeeded, and only on main / version tags
  cd:
    needs: [test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      packages: write              # caller must grant what the called workflow needs
